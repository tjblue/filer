<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napkins - Filer</title>
    {% include '_appearance.html' %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="filer-workspace bg-gray-900 min-h-screen">
    {% with section='napkins' %}{% include '_workspace_nav.html' %}{% endwith %}
    <div class="workspace-main">
    <main id="app" class="workspace-content max-w-6xl mx-auto p-4">
        <header class="workspace-heading section-heading">
            <h1>Napkins</h1>
            <p class="workspace-description">Share files or text with an automatic expiration.</p>
        </header>

        <div class="napkins-layout">
            <!-- Items List -->
            <section class="napkins-list" aria-labelledby="napkins-items-title">
                <div class="section-bar">
                    <h2 id="napkins-items-title">Temporary items</h2>
                    <button onclick="refreshItems()" class="px-3 py-1 text-xs text-gray-400 hover:text-gray-200 hover:bg-gray-700 rounded flex items-center gap-1">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh
                    </button>
                </div>
                <div id="items-list">
                    <p class="workspace-empty">Loading temporary items…</p>
                </div>
            </section>

            <!-- Upload Section with Tabs -->
            <section class="napkins-compose" aria-labelledby="napkins-compose-title">
                <h2 id="napkins-compose-title">Add a napkin</h2>
                <!-- Tabs -->
                <div class="napkins-mode" aria-label="Napkin type" role="group">
                    <button id="tab-files" type="button" onclick="switchTab('files')" aria-controls="content-files" aria-pressed="true">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        Files
                    </button>
                    <button id="tab-text" type="button" onclick="switchTab('text')" aria-controls="content-text" aria-pressed="false">
                        <i data-lucide="file-text" class="w-4 h-4"></i>
                        Text
                    </button>
                </div>

                <!-- Tab Content -->
                <div class="napkins-fields">
                    <!-- Files Tab -->
                    <div id="content-files">
                        <button type="button" id="drop-zone" class="napkins-drop">
                            <i data-lucide="upload-cloud" class="w-5 h-5 mx-auto mb-2"></i>
                            <span class="block text-gray-200">Drop files here or browse</span>
                            <span class="block text-xs text-gray-400 mt-1">Maximum file size: {% if max_file_size_mb >= 1024 %}{{ '%g'|format(max_file_size_mb / 1024) }} GiB{% else %}{{ max_file_size_mb }} MiB{% endif %}</span>
                        </button>
                        <input type="file" id="file-input" multiple class="hidden">

                        <div class="flex items-center gap-3 mt-4">
                            <label for="file-expiry" class="text-sm text-gray-400">Expires in</label>
                            <select id="file-expiry" class="bg-gray-700 text-gray-200 border border-gray-600 rounded px-3 py-2 text-sm outline-none focus:border-blue-500">
                                <option value="1">1 hour</option>
                                <option value="2" selected>2 hours</option>
                                <option value="6">6 hours</option>
                                <option value="12">12 hours</option>
                                <option value="24">24 hours</option>
                                <option value="72">3 days</option>
                                <option value="168">7 days</option>
                            </select>
                        </div>

                        <!-- Upload Progress -->
                        <div id="upload-progress" class="hidden mt-4">
                            <div class="bg-gray-700 rounded-full h-2 overflow-hidden">
                                <div id="progress-fill" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%"></div>
                            </div>
                            <p id="progress-text" class="text-xs text-gray-400 mt-2">Uploading...</p>
                        </div>
                    </div>

                    <!-- Text Tab -->
                    <div id="content-text" class="hidden">
                        <form id="text-form" class="space-y-3">
                            <input type="text" id="text-title" aria-label="Title (optional)" placeholder="Title (optional)"
                                   class="w-full bg-gray-700 text-gray-200 border border-gray-600 rounded px-3 py-2 text-sm outline-none focus:border-blue-500 placeholder-gray-500">
                            <textarea id="text-content" aria-label="Text to share" placeholder="Paste your text, code, or notes here..."
                                      class="w-full bg-gray-700 text-gray-200 border border-gray-600 rounded px-3 py-2 text-sm min-h-[120px] font-mono outline-none focus:border-blue-500 placeholder-gray-500"></textarea>
                            <div class="flex items-center gap-3">
                                <label for="text-expiry" class="text-sm text-gray-400">Expires in</label>
                                <select id="text-expiry" class="bg-gray-700 text-gray-200 border border-gray-600 rounded px-3 py-2 text-sm outline-none focus:border-blue-500">
                                    <option value="1">1 hour</option>
                                    <option value="2" selected>2 hours</option>
                                    <option value="6">6 hours</option>
                                    <option value="12">12 hours</option>
                                    <option value="24">24 hours</option>
                                    <option value="72">3 days</option>
                                    <option value="168">7 days</option>
                                </select>
                            </div>
                            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">
                                Save Text
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 px-4 py-2 rounded-lg shadow-lg text-white transform translate-y-20 transition-transform duration-300 border border-gray-600"></div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Tab switching
        function switchTab(tab) {
            for (const mode of ['files', 'text']) {
                const active = mode === tab;
                document.getElementById('tab-' + mode).setAttribute('aria-pressed', String(active));
                document.getElementById('content-' + mode).classList.toggle('hidden', !active);
            }
        }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileExpiry = document.getElementById('file-expiry');
        const textForm = document.getElementById('text-form');
        const textTitle = document.getElementById('text-title');
        const textContent = document.getElementById('text-content');
        const textExpiry = document.getElementById('text-expiry');
        const itemsList = document.getElementById('items-list');
        const uploadProgress = document.getElementById('upload-progress');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const toast = document.getElementById('toast');

        // Toast notifications
        function showToast(message, type = 'info') {
            toast.textContent = message;
            const colors = {
                error: 'bg-red-500',
                success: 'bg-green-500',
                info: 'bg-blue-500'
            };
            toast.className = `fixed bottom-4 right-4 px-4 py-2 rounded-lg shadow-lg text-white transition-transform duration-300 border border-gray-600 ${colors[type]}`;
            toast.style.transform = 'translateY(0)';
            setTimeout(() => {
                toast.style.transform = 'translateY(100px)';
            }, 3000);
        }

        // Format file size
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
        }

        // Format time remaining
        function formatTimeRemaining(expiresAt) {
            const now = new Date();
            const expires = new Date(expiresAt);
            const diff = expires - now;

            if (diff <= 0) return 'Expired';

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (hours >= 24) {
                const days = Math.floor(hours / 24);
                const remainingHours = hours % 24;
                return days + 'd ' + remainingHours + 'h';
            }
            if (hours > 0) return hours + 'h ' + minutes + 'm';
            return minutes + 'm';
        }

        // Check if expiring soon (< 1 hour)
        function isExpiringSoon(expiresAt) {
            const expires = new Date(expiresAt);
            const now = new Date();
            const diff = expires - now;
            return diff > 0 && diff < 3600000;
        }

        // Drop zone events
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drop-zone-hover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drop-zone-hover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone-hover');
            if (e.dataTransfer.files.length) {
                uploadFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                uploadFiles(fileInput.files);
            }
        });

        // Upload files
        async function uploadFiles(files) {
            const expiryHours = parseInt(fileExpiry.value);

            uploadProgress.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressText.textContent = 'Uploading...';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('expiry_hours', expiryHours);

                try {
                    const xhr = new XMLHttpRequest();

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            progressFill.style.width = percent + '%';
                            progressText.textContent = `Uploading ${file.name}... ${percent}%`;
                        }
                    });

                    await new Promise((resolve, reject) => {
                        xhr.addEventListener('load', () => {
                            if (xhr.status === 200) {
                                resolve(JSON.parse(xhr.responseText));
                            } else {
                                reject(new Error('Upload failed'));
                            }
                        });
                        xhr.addEventListener('error', reject);
                        xhr.open('POST', '/napkins/upload');
                        xhr.send(formData);
                    });

                    showToast(`Uploaded: ${file.name}`, 'success');
                } catch (error) {
                    showToast(`Failed: ${file.name}`, 'error');
                }
            }

            uploadProgress.classList.add('hidden');
            fileInput.value = '';
            refreshItems();
        }

        // Text form submit
        textForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const content = textContent.value.trim();
            if (!content) {
                showToast('Please enter some text', 'error');
                return;
            }

            try {
                const response = await fetch('/napkins/text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: content,
                        title: textTitle.value.trim(),
                        expiry_hours: parseInt(textExpiry.value)
                    })
                });

                if (response.ok) {
                    showToast('Text saved!', 'success');
                    textContent.value = '';
                    textTitle.value = '';
                    refreshItems();
                } else {
                    throw new Error('Failed to save');
                }
            } catch (error) {
                showToast('Failed to save text', 'error');
            }
        });

        // Refresh items list
        async function refreshItems() {
            try {
                const response = await fetch('/napkins/api/items');
                const data = await response.json();

                if (data.items.length === 0) {
                    itemsList.innerHTML = `
                        <p class="workspace-empty">No temporary items yet.</p>
                    `;
                    return;
                }

                itemsList.innerHTML = data.items.map(item => {
                    const icon = item.type === 'file' ? 'file' : 'file-text';
                    const expiresIn = formatTimeRemaining(item.expires_at);
                    const expiringSoon = isExpiringSoon(item.expires_at);

                    return `
                        <div class="napkins-item">
                            <div class="flex items-start justify-between gap-3">
                                <div class="flex items-start gap-3 flex-1 min-w-0">
                                    <i data-lucide="${icon}" class="w-4 h-4 text-gray-400 mt-0.5 flex-shrink-0"></i>
                                    <div class="flex-1 min-w-0">
                                        <div class="text-gray-100 font-medium truncate">${escapeHtml(item.name)}</div>
                                        <div class="text-xs text-gray-400 mt-1 flex items-center gap-3 flex-wrap">
                                            <span>${formatSize(item.size_bytes)}</span>
                                            <span class="flex items-center gap-1 ${expiringSoon ? 'text-orange-400' : ''}">
                                                <i data-lucide="clock" class="w-3 h-3"></i>
                                                ${expiresIn}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex gap-1 flex-shrink-0">
                                    ${item.type === 'file'
                                        ? `<a href="/napkins/download/${item.id}" class="section-icon-action" title="Download">
                                            <i data-lucide="download" class="w-4 h-4 text-gray-300"></i>
                                        </a>`
                                        : `<button onclick="viewText('${item.id}')" class="section-icon-action" title="View">
                                            <i data-lucide="eye" class="w-4 h-4 text-gray-300"></i>
                                        </button>
                                        <button onclick="copyText('${item.id}')" class="section-icon-action" title="Copy">
                                            <i data-lucide="copy" class="w-4 h-4 text-gray-300"></i>
                                        </button>`
                                    }
                                    <button onclick="copyLink('${item.id}', '${item.type}')" class="section-icon-action" title="Copy Link">
                                        <i data-lucide="link" class="w-4 h-4 text-gray-300"></i>
                                    </button>
                                    <button onclick="deleteItem('${item.id}')" class="section-icon-action" title="Delete">
                                        <i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                lucide.createIcons();
            } catch (error) {
                if (!itemsList.querySelector('.napkins-item')) {
                    itemsList.innerHTML = '<p class="workspace-empty">Could not load temporary items. Use Refresh to try again.</p>';
                }
                showToast('Failed to load items', 'error');
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // View text
        function viewText(id) {
            window.open(`/napkins/view/${id}`, '_blank');
        }

        // Copy link to clipboard
        function copyLink(id, type) {
            const url = window.location.origin + (type === 'file' ? '/napkins/download/' : '/napkins/view/') + id;
            navigator.clipboard.writeText(url).then(() => {
                showToast('Link copied!', 'success');
            }).catch(() => {
                showToast('Failed to copy', 'error');
            });
        }

        // Copy text content
        async function copyText(id) {
            try {
                const response = await fetch('/napkins/raw/' + id);
                const text = await response.text();
                await navigator.clipboard.writeText(text);
                showToast('Copied to clipboard!', 'success');
            } catch (error) {
                showToast('Failed to copy', 'error');
            }
        }

        // Delete item
        async function deleteItem(id) {
            if (!confirm('Delete this item?')) return;

            try {
                const response = await fetch('/napkins/delete/' + id, { method: 'DELETE' });
                if (response.ok) {
                    showToast('Deleted!', 'success');
                    refreshItems();
                } else {
                    throw new Error('Delete failed');
                }
            } catch (error) {
                showToast('Failed to delete', 'error');
            }
        }

        // Initial load and auto-refresh
        refreshItems();
        setInterval(refreshItems, 30000);
    </script>
    </div>
</body>
</html>
